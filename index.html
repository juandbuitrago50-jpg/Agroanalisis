```html
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agroanálisis - Iniciar sesión</title>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="pagina-login">

        <div class="login-card">

            <!-- LOGO -->
            <div class="logo-container">

    <img src="img/logo.png" alt="Logo de Agroanálisis" class="logo">

</div>


            <!-- TÍTULO -->
            <h1>Iniciar sesión</h1>

            <p class="descripcion">
                Ingresa tus datos para acceder a tu cuenta
            </p>


            <!-- FORMULARIO -->
            <form id="loginForm">

                <!-- CORREO -->
                <div class="campo">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Ingresa tu correo electrónico"
                        required
                    >

                </div>


                <!-- CONTRASEÑA -->
                <div class="campo">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Ingresa tu contraseña"
                        required
                    >

                </div>


                <!-- RECUPERAR CONTRASEÑA -->
                <div class="recuperar">

                    <a href="#" id="forgotPassword">
                        ¿Olvidaste tu contraseña?
                    </a>

                </div>


                <!-- BOTÓN -->
                <button
                    type="submit"
                    class="btn-login"
                >
                    Iniciar sesión
                </button>

            </form>


            <!-- REGISTRO -->
            <div class="registro">

                <span>
                    ¿No tienes una cuenta?
                </span>

                <a href="registro.html">
                    Regístrate aquí
                </a>

            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
```
